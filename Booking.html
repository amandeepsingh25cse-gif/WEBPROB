<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Booking.css">

</head>
<body>
<!-- BOOKING -->

<div class="booking" id="booking">

    <h1>Book Your College Event</h1>

    <p>
        Fill the form below to tell us about your event.
    </p>

    <form>

        <label>Name</label>

        <input
        type="text"
        placeholder="Enter your name">

        <label>Phone Number</label>

        <input
        type="text"
        placeholder="Enter your phone number">

        <label>Email</label>

        <input
        type="email"
        placeholder="Enter your email">

        <label>Select Event</label>

        <select>

            <option>College Fest</option>
            <option>Live Concert</option>
            <option>Cultural Event</option>
            <option>Birthday Celebration</option>
            <option>Fashion Show</option>
            <option>Campus Decoration</option>

        </select>

        <label>Event Date</label>

        <input type="date">

        <label>Message</label>

        <textarea
        placeholder="Tell us about your event"></textarea>

        <button type="submit">
            Submit Booking
        </button>

    </form>

</div>

    
</body>
</html>
